name: Provision Lab Environment

# ─────────────────────────────────────────────────────────
# Runs a lab container on the shared EC2 t2.micro (Free Tier)
# Uses AWS SSM to run Docker commands — no SSH keys needed
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Unique session ID for this lab instance'
        required: true
        type: string
      lab_id:
        description: 'Lab identifier (e.g., redhat-basic-linux)'
        required: true
        type: string
      docker_image:
        description: 'Base Docker image (used if no Dockerfile exists)'
        required: true
        type: string
      ttl_minutes:
        description: 'Time-to-live in minutes (default: 30)'
        required: false
        default: '30'
        type: string

env:
  AWS_REGION: ap-south-1
  SERVER_NAME: devops-duoo-lab-server

jobs:
  provision:
    name: Provision Lab - ${{ inputs.lab_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── Find & wake up the lab EC2 server ──────────────
      - name: Find Lab Server
        id: server
        run: |
          # Look for running OR stopped instances
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.SERVER_NAME }}" "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "❌ Lab server not found! Run the 'Setup Lab Server' workflow first."
            exit 1
          fi

          # Check if instance is stopped (auto-idle-shutdown may have stopped it)
          STATE=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          if [ "$STATE" = "stopped" ]; then
            echo "💤 Lab server is stopped (was idle). Waking it up..."
            aws ec2 start-instances --instance-ids $INSTANCE_ID

            echo "⏳ Waiting for instance to be running..."
            aws ec2 wait instance-running --instance-ids $INSTANCE_ID

            # Wait extra for SSM agent + Docker to start
            echo "⏳ Waiting for services to initialize (30s)..."
            sleep 30

            echo "✅ Lab server restarted!"
          fi

          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids $INSTANCE_ID \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "✅ Lab server ready: $INSTANCE_ID ($PUBLIC_IP)"

      # ─── Find an available port ────────────────────────
      - name: Allocate Port
        id: port
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"

          # Check which ports (7681-7690) are in use via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps --format \"{{.Ports}}\" 2>/dev/null | grep -oP \"0\\.0\\.0\\.0:\\K[0-9]+\" | sort -n || echo \"\""]' \
            --query 'Command.CommandId' \
            --output text)

          # Wait for command to complete
          sleep 5
          USED_PORTS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")

          # Find first available port in range 7681-7690
          PORT=7681
          for p in $(seq 7681 7690); do
            if ! echo "$USED_PORTS" | grep -q "^${p}$"; then
              PORT=$p
              break
            fi
          done

          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "✅ Allocated port: $PORT"

      # ─── Build the Docker image on EC2 (if needed) ─────
      - name: Build Lab Image on Server
        id: build
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          LAB_ID="${{ inputs.lab_id }}"
          IMAGE_NAME="devopsduoo-lab-${LAB_ID}:latest"

          # Check if Dockerfile exists for this lab
          LAB_DOCKER_DIR="docker/${LAB_ID}"

          if [ -d "$LAB_DOCKER_DIR" ]; then
            echo "📦 Found Dockerfile for ${LAB_ID}, building on server..."

            # Read Dockerfile content
            DOCKERFILE_CONTENT=$(cat "${LAB_DOCKER_DIR}/Dockerfile" | base64 -w 0)

            # Read entrypoint if exists
            ENTRYPOINT_CONTENT=""
            if [ -f "${LAB_DOCKER_DIR}/entrypoint.sh" ]; then
              ENTRYPOINT_CONTENT=$(cat "${LAB_DOCKER_DIR}/entrypoint.sh" | base64 -w 0)
            fi

            # Build on the EC2 via SSM
            BUILD_COMMANDS=$(cat << CMDS
          #!/bin/bash
          set -e

          IMAGE_NAME="${IMAGE_NAME}"
          BUILD_DIR="/opt/devops-duoo-labs/${LAB_ID}"

          # Check if image already exists
          if docker image inspect "\$IMAGE_NAME" > /dev/null 2>&1; then
            echo "✅ Image already exists: \$IMAGE_NAME"
            exit 0
          fi

          echo "🔨 Building image: \$IMAGE_NAME"
          mkdir -p "\$BUILD_DIR"
          cd "\$BUILD_DIR"

          # Decode Dockerfile
          echo "${DOCKERFILE_CONTENT}" | base64 -d > Dockerfile

          # Decode entrypoint if provided
          if [ -n "${ENTRYPOINT_CONTENT}" ]; then
            echo "${ENTRYPOINT_CONTENT}" | base64 -d > entrypoint.sh
            chmod +x entrypoint.sh
          fi

          # Build the image
          docker build -t "\$IMAGE_NAME" .
          echo "✅ Image built successfully: \$IMAGE_NAME"
          CMDS
          )

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids $INSTANCE_ID \
              --document-name "AWS-RunShellScript" \
              --timeout-seconds 300 \
              --parameters "commands=[$(echo "$BUILD_COMMANDS" | jq -Rs .)]" \
              --query 'Command.CommandId' \
              --output text)

            echo "⏳ Waiting for image build (this may take 2-3 min on first run)..."

            # Wait for build to complete
            for i in $(seq 1 60); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $INSTANCE_ID \
                --query 'Status' \
                --output text 2>/dev/null || echo "Pending")

              if [ "$STATUS" = "Success" ]; then
                echo "✅ Image build complete"
                break
              elif [ "$STATUS" = "Failed" ]; then
                echo "❌ Image build failed!"
                aws ssm get-command-invocation \
                  --command-id $COMMAND_ID \
                  --instance-id $INSTANCE_ID \
                  --query 'StandardErrorContent' \
                  --output text
                exit 1
              fi

              sleep 5
            done

            echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT
          else
            echo "⚠️ No Dockerfile found, using input image: ${{ inputs.docker_image }}"
            echo "image=${{ inputs.docker_image }}" >> $GITHUB_OUTPUT
          fi

      # ─── Run the lab container ─────────────────────────
      - name: Start Lab Container
        id: start
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          PORT="${{ steps.port.outputs.port }}"
          IMAGE="${{ steps.build.outputs.image }}"
          SESSION_ID="${{ inputs.session_id }}"
          TTL="${{ inputs.ttl_minutes }}"

          RUN_COMMANDS=$(cat << CMDS
          #!/bin/bash
          set -e

          # Run the lab container
          docker run -d \
            --name "lab-${SESSION_ID}" \
            -p ${PORT}:7681 \
            -e SESSION_ID=${SESSION_ID} \
            -e LAB_ID=${{ inputs.lab_id }} \
            -e TTL_MINUTES=${TTL} \
            --memory=384m \
            --cpus=0.5 \
            --restart=no \
            ${IMAGE}

          echo "✅ Container started on port ${PORT}"

          # Schedule auto-cleanup
          (
            sleep \$((${TTL} * 60))
            docker stop "lab-${SESSION_ID}" 2>/dev/null || true
            docker rm "lab-${SESSION_ID}" 2>/dev/null || true
            echo "🧹 Session ${SESSION_ID} auto-cleaned"
          ) &

          echo "⏱️ Auto-termination scheduled in ${TTL} minutes"
          CMDS
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[$(echo "$RUN_COMMANDS" | jq -Rs .)]" \
            --query 'Command.CommandId' \
            --output text)

          # Wait for container to start
          sleep 8

          STATUS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query 'Status' \
            --output text 2>/dev/null || echo "Pending")

          if [ "$STATUS" = "Failed" ]; then
            echo "❌ Failed to start container!"
            aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $INSTANCE_ID \
              --query 'StandardErrorContent' \
              --output text
            exit 1
          fi

          TERMINAL_URL="http://${{ steps.server.outputs.public_ip }}:${PORT}"
          echo "terminal_url=$TERMINAL_URL" >> $GITHUB_OUTPUT
          echo "✅ Lab terminal: $TERMINAL_URL"

      # ─── Output Session Info ───────────────────────────
      - name: Output Session Info
        run: |
          echo "═══════════════════════════════════════════"
          echo "  🎉 Lab Environment Ready!"
          echo "═══════════════════════════════════════════"
          echo "  Session ID:   ${{ inputs.session_id }}"
          echo "  Lab:          ${{ inputs.lab_id }}"
          echo "  Terminal:     ${{ steps.start.outputs.terminal_url }}"
          echo "  Port:         ${{ steps.port.outputs.port }}"
          echo "  TTL:          ${{ inputs.ttl_minutes }} minutes"
          echo "  Server:       ${{ steps.server.outputs.instance_id }}"
          echo "  Cost:         💚 FREE (t2.micro Free Tier)"
          echo "═══════════════════════════════════════════"
