name: Provision Lab Environment

# ─────────────────────────────────────────────────────────
# Runs a lab container on the shared EC2 t2.micro (Free Tier)
# Uses AWS SSM to run Docker commands — no SSH keys needed
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: 'Unique session ID for this lab instance'
        required: true
        type: string
      lab_id:
        description: 'Lab identifier (e.g., redhat-basic-linux)'
        required: true
        type: string
      docker_image:
        description: 'Base Docker image (used if no Dockerfile exists)'
        required: true
        type: string
      ttl_minutes:
        description: 'Time-to-live in minutes (default: 30)'
        required: false
        default: '30'
        type: string
      user_name:
        description: 'Name of the user starting the lab'
        required: false
        type: string
      docker_run_flags:
        description: 'Extra docker run flags (e.g. --privileged for DinD labs)'
        required: false
        default: ''
        type: string
      has_web_preview:
        description: 'Whether this lab needs a web preview port allocated'
        required: false
        default: 'false'
        type: string
      multi_node_config:
        description: 'JSON config for multi-node labs (e.g. K3s). Empty = single-node lab.'
        required: false
        default: ''
        type: string


env:
  AWS_REGION: ap-south-1
  SERVER_NAME: devops-duoo-lab-server
  LAB_DOMAIN: lab.devopsduoo.in

jobs:
  provision:
    name: Provision Lab - ${{ inputs.lab_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pipeline Summary
        run: |
          echo "## 🚀 Lab Provisioning Started" >> $GITHUB_STEP_SUMMARY
          if [ -z "${{ inputs.user_name }}" ]; then
            echo "**User**: \`Anonymous\` started a lab on the frontend." >> $GITHUB_STEP_SUMMARY
          else
            echo "**User**: \`${{ inputs.user_name }}\` started a lab on the frontend." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Session ID**: \`${{ inputs.session_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Lab ID**: \`${{ inputs.lab_id }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Docker Image**: \`${{ inputs.docker_image }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**TTL**: \`${{ inputs.ttl_minutes }} minutes\`" >> $GITHUB_STEP_SUMMARY
          echo "**Web Preview**: \`${{ inputs.has_web_preview }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── Find, wake, or create the lab EC2 server ──────
      - name: Find or Create Lab Server
        id: server
        run: |
          # Look for running OR stopped instances
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.SERVER_NAME }}" "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null)

          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            # ─── No server exists → Auto-create from Golden AMI ───
            echo "🔄 No lab server found. Auto-creating from Golden AMI..."

            AMI_ID=$(aws ec2 describe-images --owners self \
              --filters "Name=tag:Project,Values=DevOpsDuoo" \
                        "Name=tag:Type,Values=GoldenAMI" \
              --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
              --output text 2>/dev/null)

            if [ -z "$AMI_ID" ] || [ "$AMI_ID" = "None" ]; then
              echo "❌ No Golden AMI found! Run the 'Setup Lab Server' workflow (action=create) first."
              exit 1
            fi

            echo "📦 Using Golden AMI: $AMI_ID"

            # Find existing security group
            SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=group-name,Values=devops-duoo-lab-sg" \
              --query 'SecurityGroups[0].GroupId' --output text 2>/dev/null)

            if [ -z "$SG_ID" ] || [ "$SG_ID" = "None" ]; then
              echo "❌ Security group not found! Run the 'Setup Lab Server' workflow first."
              exit 1
            fi

            # Minimal user-data: just start services + fresh SSL cert
            cat > /tmp/quick-start.sh << 'QUICKSTART'
          #!/bin/bash
          set -e

          # Start pre-installed services
          systemctl start docker
          systemctl enable nginx
          systemctl start nginx

          # Reset Nginx port maps to clean state
          cat > /etc/nginx/lab-ports.map << 'PM'
          map $session_id $backend_port {
              default 0;
          }
          PM
          cat > /etc/nginx/lab-preview-ports.map << 'PPM'
          map $session_id $preview_port {
              default 0;
          }
          PPM

          # Fresh SSL cert via certbot
          mkdir -p /var/www/certbot

          # Temp HTTP config for certbot challenge
          cat > /etc/nginx/conf.d/certbot-temp.conf << 'CERTCONF'
          server {
              listen 80;
              server_name lab.devopsduoo.in;
              location /.well-known/acme-challenge/ { root /var/www/certbot; }
              location / { return 200 'Setting up...'; }
          }
          CERTCONF
          nginx -t && systemctl reload nginx

          certbot certonly --webroot --webroot-path /var/www/certbot \
            --domain lab.devopsduoo.in --email hello@devopsduoo.com \
            --agree-tos --non-interactive --force-renewal

          # Remove temp config, enable full proxy config
          rm -f /etc/nginx/conf.d/certbot-temp.conf
          if [ -f /etc/nginx/conf.d/lab-proxy.conf.disabled ]; then
            mv /etc/nginx/conf.d/lab-proxy.conf.disabled /etc/nginx/conf.d/lab-proxy.conf
          fi
          nginx -t && systemctl reload nginx

          # Reset idle timer
          date +%s > /opt/devops-duoo-labs/.last-active
          touch /opt/devops-duoo-labs/.setup-complete

          echo "✅ Quick-start complete!"
          QUICKSTART

            # Launch from Golden AMI
            INSTANCE_ID=$(aws ec2 run-instances \
              --image-id "$AMI_ID" \
              --instance-type t2.micro \
              --security-group-ids "$SG_ID" \
              --iam-instance-profile Name=DevOpsDuooLabProfile \
              --user-data file:///tmp/quick-start.sh \
              --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.SERVER_NAME }}},{Key=Project,Value=DevOpsDuoo},{Key=Purpose,Value=LabServer}]" \
              --metadata-options "HttpTokens=required,HttpEndpoint=enabled" \
              --query 'Instances[0].InstanceId' \
              --output text)

            echo "⏳ Waiting for instance to start..."
            aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"

            # Re-attach existing Elastic IP (kept across server lifecycles for DNS stability)
            ALLOC_ID=$(aws ec2 describe-addresses \
              --filters "Name=tag:Project,Values=DevOpsDuoo" \
              --query 'Addresses[0].AllocationId' --output text 2>/dev/null || echo "None")

            if [ "$ALLOC_ID" = "None" ] || [ -z "$ALLOC_ID" ]; then
              # No existing EIP — allocate a new one (first time or EIP was manually released)
              echo "⚠️ No existing EIP found. Allocating new one..."
              ALLOC_ID=$(aws ec2 allocate-address --domain vpc \
                --tag-specifications "ResourceType=elastic-ip,Tags=[{Key=Name,Value=devops-duoo-lab-eip},{Key=Project,Value=DevOpsDuoo}]" \
                --query 'AllocationId' --output text)
              echo "✅ New Elastic IP allocated: $ALLOC_ID"
              echo "⚠️ You may need to update your Netlify DNS A record for lab.devopsduoo.in"
            else
              echo "✅ Reusing existing Elastic IP: $ALLOC_ID"
            fi

            aws ec2 associate-address --instance-id "$INSTANCE_ID" --allocation-id "$ALLOC_ID"

            PUBLIC_IP=$(aws ec2 describe-addresses --allocation-ids "$ALLOC_ID" \
              --query 'Addresses[0].PublicIp' --output text)
            echo "✅ Elastic IP $PUBLIC_IP associated with $INSTANCE_ID"

            # Wait for user-data to complete (Golden AMI = fast, ~90s)
            echo "⏳ Waiting for services to start..."
            for i in $(seq 1 20); do
              COMMAND_ID=$(aws ssm send-command \
                --instance-ids "$INSTANCE_ID" \
                --document-name "AWS-RunShellScript" \
                --parameters '{"commands":["test -f /opt/devops-duoo-labs/.setup-complete && echo READY || echo WAITING"]}' \
                --query 'Command.CommandId' --output text 2>/dev/null || echo "")

              if [ -n "$COMMAND_ID" ]; then
                sleep 5
                RESULT=$(aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' --output text 2>/dev/null || echo "WAITING")
                if echo "$RESULT" | grep -q "READY"; then
                  echo "✅ Server ready!"
                  break
                fi
              fi
              echo "  Still starting... ($i/20)"
              sleep 10
            done

            echo "🎉 Lab server auto-created: $INSTANCE_ID ($PUBLIC_IP)"

          else
            # ─── Server exists ───
            STATE=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_ID \
              --query 'Reservations[0].Instances[0].State.Name' \
              --output text)

            if [ "$STATE" = "stopped" ]; then
              echo "💤 Lab server is stopped (was idle). Waking it up..."
              aws ec2 start-instances --instance-ids $INSTANCE_ID

              echo "⏳ Waiting for instance to be running..."
              aws ec2 wait instance-running --instance-ids $INSTANCE_ID

              # Clear StoppedAt tag since server is active again
              aws ec2 delete-tags --resources "$INSTANCE_ID" --tags "Key=StoppedAt"

              # Wait extra for SSM agent + Docker to start
              echo "⏳ Waiting for services to initialize (30s)..."
              sleep 30

              echo "✅ Lab server restarted!"
            fi

            PUBLIC_IP=$(aws ec2 describe-instances \
              --instance-ids $INSTANCE_ID \
              --query 'Reservations[0].Instances[0].PublicIpAddress' \
              --output text)
          fi

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "✅ Lab server ready: $INSTANCE_ID ($PUBLIC_IP)"

      # ─── Find an available port ────────────────────────
      - name: Allocate Port
        id: port
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"

          # Check which ports (7681-7690) are in use via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps --format \"{{.Ports}}\" 2>/dev/null | grep -oP \"0\\.0\\.0\\.0:\\K[0-9]+\" | sort -n || echo \"\""]' \
            --query 'Command.CommandId' \
            --output text)

          # Wait for command to complete
          sleep 5
          USED_PORTS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")

          # Find first available port in range 7681-7690
          PORT=7681
          for p in $(seq 7681 7690); do
            if ! echo "$USED_PORTS" | grep -q "^${p}$"; then
              PORT=$p
              break
            fi
          done

          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "✅ Allocated port: $PORT"

      # ─── Find an available preview port ────────────────
      - name: Allocate Preview Port
        id: preview_port
        if: inputs.has_web_preview == 'true'
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"

          # Check which preview ports (8081-8090) are in use via SSM
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps --format \"{{.Ports}}\" 2>/dev/null | grep -oP \"0\\.0\\.0\\.0:\\K[0-9]+\" | sort -n || echo \"\""]' \
            --query 'Command.CommandId' \
            --output text)

          # Wait for command to complete
          sleep 5
          USED_PORTS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")

          # Find first available preview port in range 8081-8090
          PREVIEW_PORT=8081
          for p in $(seq 8081 8090); do
            if ! echo "$USED_PORTS" | grep -q "^${p}$"; then
              PREVIEW_PORT=$p
              break
            fi
          done

          echo "preview_port=$PREVIEW_PORT" >> $GITHUB_OUTPUT
          echo "✅ Allocated preview port: $PREVIEW_PORT"

      # ─── Docker Image (Pull from Hub) ──────────────────
      - name: Set Lab Image
        id: build
        run: |
          echo "📦 Using Docker image: ${{ inputs.docker_image }}"
          echo "image=${{ inputs.docker_image }}" >> $GITHUB_OUTPUT

      # ─── Run the lab container (single-node) ────────────
      - name: Start Lab Container
        id: start
        if: inputs.multi_node_config == ''
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          PORT="${{ steps.port.outputs.port }}"
          PREVIEW_PORT="${{ steps.preview_port.outputs.preview_port }}"
          IMAGE="${{ steps.build.outputs.image }}"
          SESSION_ID="${{ inputs.session_id }}"
          TTL="${{ inputs.ttl_minutes }}"
          LAB_ID="${{ inputs.lab_id }}"
          HAS_PREVIEW="${{ inputs.has_web_preview }}"

          # Build docker run command — include extra flags if provided (e.g. --privileged for DinD)
          EXTRA_FLAGS="${{ inputs.docker_run_flags }}"

          # Use default memory limit unless extra flags override it
          MEMORY_FLAG="--memory=384m"
          if echo "$EXTRA_FLAGS" | grep -q "\-\-memory"; then
            MEMORY_FLAG=""
          fi

          PREVIEW_FLAG=""
          if [ "$HAS_PREVIEW" = "true" ] && [ -n "$PREVIEW_PORT" ]; then
            PREVIEW_FLAG="-p ${PREVIEW_PORT}:8080"
          fi

          RUN_CMD="docker run -d --name lab-${SESSION_ID} -p ${PORT}:7681 $PREVIEW_FLAG -e SESSION_ID=${SESSION_ID} -e LAB_ID=${LAB_ID} -e TTL_MINUTES=${TTL} ${MEMORY_FLAG} --cpus=0.5 --restart=no ${EXTRA_FLAGS} ${IMAGE} && echo Container started on port ${PORT}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"${RUN_CMD}\"]}" \
            --query 'Command.CommandId' \
            --output text)

          # Wait for container to start
          echo "⏳ Starting container..."
          sleep 10

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'Status' \
            --output text 2>/dev/null || echo "Pending")

          if [ "$STATUS" = "Failed" ]; then
            echo "❌ Failed to start container!"
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardErrorContent' \
              --output text 2>/dev/null || true
            exit 1
          fi

          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          echo "$OUTPUT"

          echo "port=$PORT" >> $GITHUB_OUTPUT
          echo "✅ Container started on port $PORT"

      # ─── Run multi-node lab containers (e.g. K3s) ───────
      - name: Start Multi-Node Lab Containers
        id: start_multi
        if: inputs.multi_node_config != ''
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          SESSION_ID="${{ inputs.session_id }}"
          TTL="${{ inputs.ttl_minutes }}"
          LAB_ID="${{ inputs.lab_id }}"
          MULTI_CONFIG='${{ inputs.multi_node_config }}'

          echo "🔧 Multi-node lab detected. Parsing config..."
          echo "$MULTI_CONFIG" | jq .

          # Extract node info from JSON config
          NODE_COUNT=$(echo "$MULTI_CONFIG" | jq '.nodes | length')
          echo "📦 Starting $NODE_COUNT node(s)..."

          # ── Allocate ports for each node ──────────────
          # Check which ports are in use
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["docker ps --format \"{{.Ports}}\" 2>/dev/null | grep -oP \"0\\.0\\.0\\.0:\\K[0-9]+\" | sort -n || echo \"\""  ]' \
            --query 'Command.CommandId' \
            --output text)
          sleep 5
          USED_PORTS=$(aws ssm get-command-invocation \
            --command-id $COMMAND_ID \
            --instance-id $INSTANCE_ID \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")

          # Allocate N consecutive ports starting from 7681
          ALLOCATED_PORTS=""
          NEXT_PORT=7681
          for i in $(seq 0 $((NODE_COUNT - 1))); do
            while echo "$USED_PORTS" | grep -q "^${NEXT_PORT}$" || echo "$ALLOCATED_PORTS" | grep -q "$NEXT_PORT"; do
              NEXT_PORT=$((NEXT_PORT + 1))
            done
            if [ -z "$ALLOCATED_PORTS" ]; then
              ALLOCATED_PORTS="$NEXT_PORT"
            else
              ALLOCATED_PORTS="$ALLOCATED_PORTS,$NEXT_PORT"
            fi
            NEXT_PORT=$((NEXT_PORT + 1))
          done
          echo "✅ Allocated ports: $ALLOCATED_PORTS"

          # ── Create a Docker network for this session ──
          NET_NAME="lab-net-${SESSION_ID}"
          NET_CMD="docker network create ${NET_NAME} 2>/dev/null || true"
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"${NET_CMD}\"]}" \
            --query 'Command.CommandId' --output text)
          sleep 3
          echo "✅ Created Docker network: $NET_NAME"

          # ── Start each node container ─────────────────
          PORT_MAP=""  # JSON object: {"master": 7681, "worker": 7682}
          MASTER_CONTAINER=""

          for i in $(seq 0 $((NODE_COUNT - 1))); do
            NODE_ID=$(echo "$MULTI_CONFIG" | jq -r ".nodes[$i].id")
            NODE_IMAGE=$(echo "$MULTI_CONFIG" | jq -r ".nodes[$i].dockerImage")
            NODE_FLAGS=$(echo "$MULTI_CONFIG" | jq -r ".nodes[$i].dockerRunFlags // \"\"")
            PORT=$(echo "$ALLOCATED_PORTS" | cut -d',' -f$((i + 1)))

            CONTAINER_NAME="lab-${SESSION_ID}-${NODE_ID}"

            echo "🚀 Starting node: $NODE_ID (image: $NODE_IMAGE, port: $PORT)"

            # Build the docker run command
            # For master: use the shared token and expose API port
            # For worker: connect to master via Docker network
            EXTRA_ENV="-e SESSION_ID=${SESSION_ID} -e LAB_ID=${LAB_ID} -e TTL_MINUTES=${TTL} -e K3S_TOKEN=devopsduoo-${SESSION_ID}"

            if [ "$NODE_ID" = "master" ]; then
              EXTRA_ENV="$EXTRA_ENV -e MASTER_IP=${CONTAINER_NAME}"
              MASTER_CONTAINER="$CONTAINER_NAME"
            elif [ -n "$MASTER_CONTAINER" ]; then
              EXTRA_ENV="$EXTRA_ENV -e K3S_URL=https://${MASTER_CONTAINER}:6443"
            fi

            RUN_CMD="docker run -d --name ${CONTAINER_NAME} --network ${NET_NAME} --hostname ${NODE_ID} -p ${PORT}:7681 ${EXTRA_ENV} --cpus=0.5 --restart=no ${NODE_FLAGS} ${NODE_IMAGE} && echo Node ${NODE_ID} started on port ${PORT}"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "{\"commands\":[\"${RUN_CMD}\"]}" \
              --query 'Command.CommandId' --output text)

            echo "⏳ Waiting for $NODE_ID to start..."
            sleep 10

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")

            if [ "$STATUS" = "Failed" ]; then
              echo "❌ Failed to start $NODE_ID!"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text 2>/dev/null || true
              exit 1
            fi

            echo "✅ $NODE_ID started on port $PORT"

            # Build port map JSON
            if [ -z "$PORT_MAP" ]; then
              PORT_MAP="{\"${NODE_ID}\": ${PORT}"
            else
              PORT_MAP="${PORT_MAP}, \"${NODE_ID}\": ${PORT}"
            fi
          done

          PORT_MAP="${PORT_MAP}}"
          echo "port_map=$PORT_MAP" >> $GITHUB_OUTPUT
          echo "network=$NET_NAME" >> $GITHUB_OUTPUT
          echo "✅ All nodes started. Port map: $PORT_MAP"

      # ─── Register session in Nginx reverse proxy ────
      - name: Register Session in Nginx (Single Node)
        id: register
        if: inputs.multi_node_config == ''
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          SESSION_ID="${{ inputs.session_id }}"
          PORT="${{ steps.start.outputs.port }}"
          PREVIEW_PORT="${{ steps.preview_port.outputs.preview_port }}"
          HAS_PREVIEW="${{ inputs.has_web_preview }}"

          # Add session→port mapping to Nginx and reload
          # Pass both ports if preview is enabled
          if [ "$HAS_PREVIEW" = "true" ] && [ -n "$PREVIEW_PORT" ]; then
            CMD="lab-add-session ${SESSION_ID} ${PORT} ${PREVIEW_PORT}"
          else
            CMD="lab-add-session ${SESSION_ID} ${PORT}"
          fi

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters "{\"commands\":[\"$CMD\"]}" \
            --query 'Command.CommandId' \
            --output text)

          sleep 5

          REG_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "")
          echo "$REG_OUTPUT"

          # Terminal URL via Nginx SSL proxy
          TERMINAL_URL="https://${{ env.LAB_DOMAIN }}/s/${SESSION_ID}/"
          echo "terminal_url=$TERMINAL_URL" >> $GITHUB_OUTPUT
          echo "✅ Terminal URL: $TERMINAL_URL"

      # ─── Register multi-node sessions in Nginx ──────
      - name: Register Multi-Node Sessions in Nginx
        id: register_multi
        if: inputs.multi_node_config != ''
        run: |
          INSTANCE_ID="${{ steps.server.outputs.instance_id }}"
          SESSION_ID="${{ inputs.session_id }}"
          PORT_MAP='${{ steps.start_multi.outputs.port_map }}'
          MULTI_CONFIG='${{ inputs.multi_node_config }}'

          echo "🔧 Registering multi-node Nginx routes..."
          echo "Port map: $PORT_MAP"

          NODE_COUNT=$(echo "$MULTI_CONFIG" | jq '.nodes | length')
          TERMINAL_URLS=""

          for i in $(seq 0 $((NODE_COUNT - 1))); do
            NODE_ID=$(echo "$MULTI_CONFIG" | jq -r ".nodes[$i].id")
            PORT=$(echo "$PORT_MAP" | jq -r ".\"${NODE_ID}\"")

            # Register each node as a sub-session: session_id-node_id → port
            SUB_SESSION="${SESSION_ID}-${NODE_ID}"
            CMD="lab-add-session ${SUB_SESSION} ${PORT}"

            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters "{\"commands\":[\"$CMD\"]}" \
              --query 'Command.CommandId' --output text)
            sleep 3

            TERMINAL_URL="https://${{ env.LAB_DOMAIN }}/s/${SUB_SESSION}/"
            echo "✅ $NODE_ID terminal: $TERMINAL_URL"

            if [ -z "$TERMINAL_URLS" ]; then
              TERMINAL_URLS="{\"${NODE_ID}\": \"${TERMINAL_URL}\""
            else
              TERMINAL_URLS="${TERMINAL_URLS}, \"${NODE_ID}\": \"${TERMINAL_URL}\""
            fi
          done

          TERMINAL_URLS="${TERMINAL_URLS}}"
          echo "terminal_urls=$TERMINAL_URLS" >> $GITHUB_OUTPUT
          echo "✅ All terminal URLs registered: $TERMINAL_URLS"

      # ─── Output Session Info ───────────────────────────
      - name: Output Session Info
        run: |
          echo "═══════════════════════════════════════════"
          echo "  🎉 Lab Environment Ready!"
          echo "═══════════════════════════════════════════"
          echo "  Session ID:   ${{ inputs.session_id }}"
          echo "  Lab:          ${{ inputs.lab_id }}"

          if [ -z '${{ inputs.multi_node_config }}' ]; then
            echo "  Terminal:     ${{ steps.register.outputs.terminal_url }}"
          else
            echo "  Multi-node:   Yes"
            echo "  Terminal URLs: ${{ steps.register_multi.outputs.terminal_urls }}"
          fi

          if [ "${{ inputs.has_web_preview }}" = "true" ]; then
            echo "  Preview URL:  https://${{ env.LAB_DOMAIN }}/s/${{ inputs.session_id }}/preview/"
          fi
          echo "  TTL:          ${{ inputs.ttl_minutes }} minutes"
          echo "  Server:       ${{ steps.server.outputs.instance_id }}"
          echo "  Cost:         💚 FREE (t2.micro Free Tier)"
          echo "═══════════════════════════════════════════"
