name: Setup Lab Server (One-Time)

# ─────────────────────────────────────────────────────────
# Run this ONCE to create the free-tier EC2 lab server.
# It creates a t2.micro instance with Docker pre-installed.
# 
# Free Tier: 750 hours/month of t2.micro = 24/7 for free
# ─────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - create
          - status
          - destroy

env:
  AWS_REGION: ap-south-1
  INSTANCE_TYPE: t2.micro
  SERVER_NAME: devops-duoo-lab-server
  KEY_NAME: devops-duoo-labs-key
  LAB_DOMAIN: lab.devopsduoo.in
  CERTBOT_EMAIL: hello@devopsduoo.com

jobs:
  setup:
    name: ${{ inputs.action }} Lab Server
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── STATUS ────────────────────────────────────────
      - name: Check Existing Server
        id: check
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.SERVER_NAME }}" "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null || echo "None")

          if [ "$INSTANCE_ID" != "None" ] && [ "$INSTANCE_ID" != "" ]; then
            STATE=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].State.Name' --output text)
            PUBLIC_IP=$(aws ec2 describe-instances --instance-ids $INSTANCE_ID --query 'Reservations[0].Instances[0].PublicIpAddress' --output text)
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
            echo "state=$STATE" >> $GITHUB_OUTPUT
            echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
            echo "✅ Lab server found: $INSTANCE_ID ($STATE) - IP: $PUBLIC_IP"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "❌ No lab server found"
          fi

      - name: Show Status
        if: inputs.action == 'status'
        run: |
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "═══════════════════════════════════════════"
            echo "  Lab Server Status"
            echo "═══════════════════════════════════════════"
            echo "  Instance ID: ${{ steps.check.outputs.instance_id }}"
            echo "  State:       ${{ steps.check.outputs.state }}"
            echo "  Public IP:   ${{ steps.check.outputs.public_ip }}"
            echo "═══════════════════════════════════════════"
          else
            echo "No lab server exists. Run with action=create to set one up."
          fi

      # ─── DESTROY ───────────────────────────────────────
      - name: Destroy Server
        if: inputs.action == 'destroy' && steps.check.outputs.exists == 'true'
        run: |
          aws ec2 terminate-instances --instance-ids ${{ steps.check.outputs.instance_id }}
          echo "🗑️ Lab server terminated: ${{ steps.check.outputs.instance_id }}"

      # ─── CREATE ────────────────────────────────────────
      - name: Create Security Group
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        id: sg
        run: |
          # Check if SG exists
          SG_ID=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=devops-duoo-lab-sg" \
            --query 'SecurityGroups[0].GroupId' \
            --output text 2>/dev/null || echo "None")

          if [ "$SG_ID" = "None" ] || [ -z "$SG_ID" ]; then
            SG_ID=$(aws ec2 create-security-group \
              --group-name devops-duoo-lab-sg \
              --description "Security group for DevOps Duoo lab sessions" \
              --query 'GroupId' \
              --output text)
            echo "✅ Security group created: $SG_ID"
          else
            echo "✅ Security group exists: $SG_ID"
          fi

          # Always ensure rules exist (ignore errors if they already exist)
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 22 --cidr 0.0.0.0/0 2>/dev/null || true
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 7681-7690 --cidr 0.0.0.0/0 2>/dev/null || true
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 80 --cidr 0.0.0.0/0 2>/dev/null || true
          aws ec2 authorize-security-group-ingress --group-id $SG_ID --protocol tcp --port 443 --cidr 0.0.0.0/0 2>/dev/null || true

          echo "sg_id=$SG_ID" >> $GITHUB_OUTPUT

      - name: Get Amazon Linux 2023 AMI
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        id: ami
        run: |
          AMI_ID=$(aws ec2 describe-images \
            --owners amazon \
            --filters "Name=name,Values=al2023-ami-2023*-x86_64" "Name=state,Values=available" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text)

          echo "ami_id=$AMI_ID" >> $GITHUB_OUTPUT
          echo "✅ Using AMI: $AMI_ID"

      - name: Create IAM Role for SSM
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        id: iam
        run: |
          # Check if role exists
          ROLE_EXISTS=$(aws iam get-role --role-name DevOpsDuooLabRole --query 'Role.RoleName' --output text 2>/dev/null || echo "None")

          if [ "$ROLE_EXISTS" = "None" ]; then
            # Create trust policy
            cat > trust-policy.json << 'EOF'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Principal": { "Service": "ec2.amazonaws.com" },
                "Action": "sts:AssumeRole"
              }
            ]
          }
          EOF

            aws iam create-role --role-name DevOpsDuooLabRole --assume-role-policy-document file://trust-policy.json
            aws iam attach-role-policy --role-name DevOpsDuooLabRole --policy-arn arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore

            # Allow the instance to stop itself (for auto-idle-shutdown)
            cat > ec2-self-stop-policy.json << 'POLICY'
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": [
                  "ec2:StopInstances",
                  "ec2:DescribeInstances"
                ],
                "Resource": "*",
                "Condition": {
                  "StringEquals": {
                    "ec2:ResourceTag/Project": "DevOpsDuoo"
                  }
                }
              }
            ]
          }
          POLICY
            aws iam put-role-policy \
              --role-name DevOpsDuooLabRole \
              --policy-name DevOpsDuooSelfStop \
              --policy-document file://ec2-self-stop-policy.json

            echo "✅ IAM role created (with SSM + self-stop permissions)"
          else
            echo "✅ IAM role exists"
          fi

          # Check if instance profile exists
          PROFILE_EXISTS=$(aws iam get-instance-profile --instance-profile-name DevOpsDuooLabProfile --query 'InstanceProfile.InstanceProfileName' --output text 2>/dev/null || echo "None")

          if [ "$PROFILE_EXISTS" = "None" ]; then
            aws iam create-instance-profile --instance-profile-name DevOpsDuooLabProfile
            aws iam add-role-to-instance-profile --instance-profile-name DevOpsDuooLabProfile --role-name DevOpsDuooLabRole
            sleep 10  # Wait for profile propagation
            echo "✅ Instance profile created"
          else
            echo "✅ Instance profile exists"
          fi

      - name: Launch EC2 Instance
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        id: launch
        run: |
          # User data script to install Docker + auto-idle-shutdown
          cat > user-data.sh << 'USERDATA'
          #!/bin/bash
          set -e

          # Update system
          dnf update -y

          # Install Docker, AWS CLI, Nginx, Certbot & Cronie
          dnf install -y docker aws-cli jq nginx python3-pip cronie
          pip3 install certbot certbot-nginx
          systemctl enable docker
          systemctl start docker

          # Add ec2-user to docker group
          usermod -aG docker ec2-user

          # Install Docker Compose
          curl -Lo /usr/local/bin/docker-compose \
            "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-x86_64"
          chmod +x /usr/local/bin/docker-compose

          # Create lab directory
          mkdir -p /opt/devops-duoo-labs

          # ────────────────────────────────────────────
          # Auto-Idle Shutdown Script
          # Stops the EC2 instance if no lab containers
          # have been running for over 1 hour
          # ────────────────────────────────────────────
          cat > /opt/devops-duoo-labs/idle-shutdown.sh << 'IDLE_SCRIPT'
          #!/bin/bash
          IDLE_FILE="/opt/devops-duoo-labs/.last-active"
          IDLE_THRESHOLD_SECONDS=3600  # 1 hour

          # Count running lab containers
          LAB_CONTAINERS=$(docker ps --filter "name=lab-" --format "{{.Names}}" 2>/dev/null | wc -l)

          if [ "$LAB_CONTAINERS" -gt 0 ]; then
            # Active sessions found — reset idle timer
            date +%s > "$IDLE_FILE"
            echo "[idle-monitor] $(date): $LAB_CONTAINERS active session(s), timer reset"
          else
            # No active sessions
            if [ ! -f "$IDLE_FILE" ]; then
              # First time seeing idle — start the timer
              date +%s > "$IDLE_FILE"
              echo "[idle-monitor] $(date): No sessions, starting idle timer"
            else
              LAST_ACTIVE=$(cat "$IDLE_FILE")
              NOW=$(date +%s)
              IDLE_SECONDS=$((NOW - LAST_ACTIVE))

              echo "[idle-monitor] $(date): No sessions, idle for ${IDLE_SECONDS}s / ${IDLE_THRESHOLD_SECONDS}s"

              if [ "$IDLE_SECONDS" -ge "$IDLE_THRESHOLD_SECONDS" ]; then
                echo "[idle-monitor] $(date): 🛑 Idle threshold reached. Stopping instance..."

                # Clean up any stopped containers and dangling images
                docker container prune -f 2>/dev/null || true
                docker image prune -f 2>/dev/null || true

                # Stop the instance (not terminate — it can be restarted)
                # IMDSv2: get token first, then use it for metadata requests
                IMDS_TOKEN=$(curl -s -X PUT "http://169.254.169.254/latest/api/token" -H "X-aws-ec2-metadata-token-ttl-seconds: 60")
                INSTANCE_ID=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/instance-id)
                REGION=$(curl -s -H "X-aws-ec2-metadata-token: $IMDS_TOKEN" http://169.254.169.254/latest/meta-data/placement/region)
                aws ec2 stop-instances --instance-ids "$INSTANCE_ID" --region "$REGION"
              fi
            fi
          fi
          IDLE_SCRIPT

          chmod +x /opt/devops-duoo-labs/idle-shutdown.sh

          # Run idle check every 10 minutes via cron
          echo "*/10 * * * * root /opt/devops-duoo-labs/idle-shutdown.sh >> /var/log/idle-monitor.log 2>&1" > /etc/cron.d/lab-idle-monitor
          chmod 644 /etc/cron.d/lab-idle-monitor

          # Initialize idle timer (server just started = active)
          date +%s > /opt/devops-duoo-labs/.last-active

          # ────────────────────────────────────────────
          # Initialize Nginx port map for lab sessions
          # ────────────────────────────────────────────
          mkdir -p /var/www/certbot
          cat > /etc/nginx/lab-ports.map << 'PORTMAP'
          map $session_id $backend_port {
              default 0;
          }
          PORTMAP

          # ────────────────────────────────────────────
          # Configure Nginx Reverse Proxy (Disabled initially)
          # ────────────────────────────────────────────
          cat > /etc/nginx/conf.d/lab-proxy.conf.disabled << NGINXCONF
          include /etc/nginx/lab-ports.map;

          server {
              listen 80;
              server_name lab.devopsduoo.in;

              location /.well-known/acme-challenge/ {
                  root /var/www/certbot;
              }

              location / {
                  return 301 https://\$host\$request_uri;
              }
          }

          server {
              listen 443 ssl http2;
              server_name lab.devopsduoo.in;

              ssl_certificate /etc/letsencrypt/live/lab.devopsduoo.in/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/lab.devopsduoo.in/privkey.pem;

              ssl_protocols TLSv1.2 TLSv1.3;
              ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
              ssl_prefer_server_ciphers off;
              ssl_session_cache shared:SSL:10m;
              ssl_session_timeout 1d;

              add_header Strict-Transport-Security "max-age=63072000" always;
              add_header Content-Security-Policy "frame-ancestors http://localhost:* http://127.0.0.1:* https://*.devopsduoo.in https://devopsduoo.in https://*.devopsduoo.com https://devopsduoo.com" always;
              add_header X-Content-Type-Options "nosniff" always;

              location ~ ^/s/([^/]+)/(.*) {
                  set \$session_id \$1;
                  set \$remaining_path \$2;

                  if (\$backend_port = 0) {
                      return 404 '{"error": "Session not found or expired"}';
                  }

                  proxy_pass http://127.0.0.1:\$backend_port/\$remaining_path\$is_args\$args;
                  proxy_http_version 1.1;
                  
                  # Strip X-Frame-Options from ttyd to allow our CSP to handle iframe framing
                  proxy_hide_header X-Frame-Options;
                  proxy_hide_header Content-Security-Policy;

                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
                  proxy_set_header X-Real-IP \$remote_addr;
                  proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto \$scheme;
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
                  proxy_buffering off;
                  proxy_cache off;
              }

              location /health {
                  return 200 '{"status": "ok"}';
                  add_header Content-Type application/json;
              }

              location / {
                  return 200 '{"service": "DevOps Duoo Lab Proxy", "status": "running"}';
                  add_header Content-Type application/json;
              }
          }
          NGINXCONF

          # Remove default Nginx config
          rm -f /etc/nginx/conf.d/default.conf || true

          # Create helper script: add session to port map
          cat > /usr/local/bin/lab-add-session << 'ADDSCRIPT'
          #!/bin/bash
          SESSION_ID="$1"
          PORT="$2"
          if [ -z "$SESSION_ID" ] || [ -z "$PORT" ]; then
              echo "Usage: lab-add-session <session-id> <port>"
              exit 1
          fi
          sed -i "/^}$/i\\    $SESSION_ID $PORT;" /etc/nginx/lab-ports.map
          nginx -s reload 2>/dev/null || true
          echo "Added session $SESSION_ID -> port $PORT"
          ADDSCRIPT
          chmod +x /usr/local/bin/lab-add-session

          # Create helper script: remove session from port map
          cat > /usr/local/bin/lab-remove-session << 'RMSCRIPT'
          #!/bin/bash
          SESSION_ID="$1"
          if [ -z "$SESSION_ID" ]; then
              echo "Usage: lab-remove-session <session-id>"
              exit 1
          fi
          sed -i "/$SESSION_ID/d" /etc/nginx/lab-ports.map
          nginx -s reload 2>/dev/null || true
          echo "Removed session $SESSION_ID"
          RMSCRIPT
          chmod +x /usr/local/bin/lab-remove-session

          # Tag setup as complete
          touch /opt/devops-duoo-labs/.setup-complete

          echo "✅ Lab server setup complete (with auto-idle-shutdown + Nginx)!"
          USERDATA

          INSTANCE_ID=$(aws ec2 run-instances \
            --image-id ${{ steps.ami.outputs.ami_id }} \
            --instance-type ${{ env.INSTANCE_TYPE }} \
            --security-group-ids ${{ steps.sg.outputs.sg_id }} \
            --iam-instance-profile Name=DevOpsDuooLabProfile \
            --user-data file://user-data.sh \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${{ env.SERVER_NAME }}},{Key=Project,Value=DevOpsDuoo},{Key=Purpose,Value=LabServer}]" \
            --metadata-options "HttpTokens=required,HttpEndpoint=enabled" \
            --query 'Instances[0].InstanceId' \
            --output text)

          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "🚀 EC2 instance launched: $INSTANCE_ID"

      - name: Wait for Instance to be Running
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        run: |
          echo "⏳ Waiting for instance to start..."
          aws ec2 wait instance-running --instance-ids ${{ steps.launch.outputs.instance_id }}
          echo "✅ Instance is running"

      # ─── Allocate Elastic IP ──────────────────────────
      - name: Allocate Elastic IP
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        id: eip
        run: |
          INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"

          # Check if an EIP is already tagged for this project
          EXISTING_ALLOC=$(aws ec2 describe-addresses \
            --filters "Name=tag:Project,Values=DevOpsDuoo" \
            --query 'Addresses[0].AllocationId' \
            --output text 2>/dev/null || echo "None")

          if [ "$EXISTING_ALLOC" != "None" ] && [ -n "$EXISTING_ALLOC" ]; then
            ALLOC_ID="$EXISTING_ALLOC"
            echo "✅ Reusing existing Elastic IP: $ALLOC_ID"
          else
            # Allocate a new Elastic IP
            ALLOC_ID=$(aws ec2 allocate-address \
              --domain vpc \
              --tag-specifications "ResourceType=elastic-ip,Tags=[{Key=Name,Value=devops-duoo-lab-eip},{Key=Project,Value=DevOpsDuoo}]" \
              --query 'AllocationId' \
              --output text)
            echo "✅ Allocated new Elastic IP: $ALLOC_ID"
          fi

          # Associate with the instance
          aws ec2 associate-address \
            --instance-id "$INSTANCE_ID" \
            --allocation-id "$ALLOC_ID"

          # Get the public IP
          PUBLIC_IP=$(aws ec2 describe-addresses \
            --allocation-ids "$ALLOC_ID" \
            --query 'Addresses[0].PublicIp' \
            --output text)

          echo "elastic_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "alloc_id=$ALLOC_ID" >> $GITHUB_OUTPUT
          echo "✅ Elastic IP $PUBLIC_IP associated with $INSTANCE_ID"

      # ─── Setup Nginx + SSL (via SSM after user-data completes) ────
      - name: Setup Nginx SSL
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        run: |
          INSTANCE_ID="${{ steps.launch.outputs.instance_id }}"
          LAB_DOMAIN="${{ env.LAB_DOMAIN }}"
          EMAIL="${{ env.CERTBOT_EMAIL }}"

          echo "⏳ Waiting for user-data to complete (Nginx install)..."
          # Wait for the setup-complete flag from user-data
          for i in $(seq 1 40); do
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters '{"commands":["test -f /opt/devops-duoo-labs/.setup-complete && echo READY || echo WAITING"]}' \
              --query 'Command.CommandId' \
              --output text 2>/dev/null || echo "")

            if [ -z "$COMMAND_ID" ]; then
              echo "  SSM not ready yet, waiting..."
              sleep 15
              continue
            fi

            sleep 5
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'StandardOutputContent' \
              --output text 2>/dev/null || echo "WAITING")

            if echo "$STATUS" | grep -q "READY"; then
              echo "✅ User-data complete, server is ready"
              break
            fi

            echo "  Still waiting... ($i/40)"
            sleep 15
          done

          echo "🔒 Setting up SSL certificate for $LAB_DOMAIN..."
          echo "   ⚠️  Make sure DNS A record points $LAB_DOMAIN → ${{ steps.eip.outputs.elastic_ip }}"

          # Run certbot via SSM with temporary HTTP config
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --timeout-seconds 180 \
            --parameters "{\"commands\":[
              \"cat > /etc/nginx/conf.d/lab-proxy-temp.conf << 'TEMPEOF'\",
              \"server { listen 80; server_name $LAB_DOMAIN; location /.well-known/acme-challenge/ { root /var/www/certbot; } location / { return 200 'Waiting...'; } }\",
              \"TEMPEOF\",
              \"systemctl enable nginx\",
              \"systemctl restart nginx\",
              \"mkdir -p /var/www/certbot\",
              \"certbot certonly --webroot --webroot-path /var/www/certbot --domain $LAB_DOMAIN --email $EMAIL --agree-tos --non-interactive --force-renewal\",
              \"rm -f /etc/nginx/conf.d/lab-proxy-temp.conf\",
              \"mv /etc/nginx/conf.d/lab-proxy.conf.disabled /etc/nginx/conf.d/lab-proxy.conf\",
              \"nginx -t && systemctl reload nginx && echo 'SSL_SETUP_COMPLETE' || echo 'SSL_SETUP_FAILED'\"
            ]}" \
            --query 'Command.CommandId' \
            --output text)

          sleep 30

          SSL_RESULT=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text 2>/dev/null || echo "UNKNOWN")

          if echo "$SSL_RESULT" | grep -q "SSL_SETUP_COMPLETE"; then
            echo "✅ SSL setup complete!"
          else
            echo "⚠️ SSL setup may need manual attention."
            echo "   Run on EC2: sudo bash /opt/devops-duoo-labs/setup-nginx-ssl.sh $LAB_DOMAIN $EMAIL"
            echo "   Make sure DNS is pointing $LAB_DOMAIN → ${{ steps.eip.outputs.elastic_ip }}"
          fi

          # Set up auto-renewal cron
          aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":["echo \"0 3 * * * root certbot renew --quiet --deploy-hook systemctl reload nginx\" > /etc/cron.d/certbot-renew && chmod 644 /etc/cron.d/certbot-renew"]}' \
            --output text > /dev/null 2>&1 || true

      - name: Output Summary
        if: inputs.action == 'create' && steps.check.outputs.exists != 'true'
        run: |
          echo "═══════════════════════════════════════════"
          echo "  🎉 Lab Server Created Successfully!"
          echo "═══════════════════════════════════════════"
          echo "  Instance ID: ${{ steps.launch.outputs.instance_id }}"
          echo "  Elastic IP:  ${{ steps.eip.outputs.elastic_ip }}"
          echo "  Domain:      https://${{ env.LAB_DOMAIN }}"
          echo "  Instance:    ${{ env.INSTANCE_TYPE }} (Free Tier)"
          echo ""
          echo "  📋 DNS Setup Required:"
          echo "     Add A record: ${{ env.LAB_DOMAIN }} → ${{ steps.eip.outputs.elastic_ip }}"
          echo ""
          echo "  💡 Add these GitHub Secrets / Env Vars:"
          echo "     LAB_SERVER_INSTANCE_ID = ${{ steps.launch.outputs.instance_id }}"
          echo "     LAB_DOMAIN = ${{ env.LAB_DOMAIN }}"
          echo "═══════════════════════════════════════════"
