name: Manage Lab Server

# ─────────────────────────────────────────────────────────
# Daily janitor that terminates the lab server if it has
# been stopped (idle) for more than 5 days.
# Releases the Elastic IP to save costs.
# The Golden AMI is preserved for fast recreation (~2-3 min).
# ─────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '0 6 * * *'   # Daily 6 AM UTC (11:30 AM IST)
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - auto       # Check idle duration and terminate if > 5 days
          - status     # Just show server status
          - terminate  # Force terminate now

env:
  AWS_REGION: ap-south-1
  SERVER_NAME: devops-duoo-lab-server
  IDLE_DAYS_THRESHOLD: 5

jobs:
  manage:
    name: ${{ inputs.action || 'auto' }} - Lab Server
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ─── Find Server ────────────────────────────────────
      - name: Find Server
        id: check
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=${{ env.SERVER_NAME }}" \
                      "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[0].Instances[0].InstanceId' \
            --output text 2>/dev/null || echo "None")

          if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No lab server found. Nothing to manage."
            exit 0
          fi

          STATE=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' --output text)

          PUBLIC_IP=$(aws ec2 describe-instances --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' --output text 2>/dev/null || echo "None")

          STOPPED_AT=$(aws ec2 describe-tags \
            --filters "Name=resource-id,Values=$INSTANCE_ID" "Name=key,Values=StoppedAt" \
            --query 'Tags[0].Value' --output text 2>/dev/null || echo "None")

          # Check if Golden AMI exists
          GOLDEN_AMI=$(aws ec2 describe-images --owners self \
            --filters "Name=tag:Project,Values=DevOpsDuoo" "Name=tag:Type,Values=GoldenAMI" \
            --query 'sort_by(Images, &CreationDate)[-1].ImageId' \
            --output text 2>/dev/null || echo "None")

          echo "exists=true" >> $GITHUB_OUTPUT
          echo "instance_id=$INSTANCE_ID" >> $GITHUB_OUTPUT
          echo "state=$STATE" >> $GITHUB_OUTPUT
          echo "public_ip=$PUBLIC_IP" >> $GITHUB_OUTPUT
          echo "stopped_at=$STOPPED_AT" >> $GITHUB_OUTPUT
          echo "golden_ami=$GOLDEN_AMI" >> $GITHUB_OUTPUT

          echo "═══════════════════════════════════════"
          echo "  Lab Server Status"
          echo "═══════════════════════════════════════"
          echo "  Instance ID:  $INSTANCE_ID"
          echo "  State:        $STATE"
          echo "  Public IP:    $PUBLIC_IP"
          echo "  StoppedAt:    $STOPPED_AT"
          echo "  Golden AMI:   $GOLDEN_AMI"
          echo "═══════════════════════════════════════"

      # ─── Status Only ────────────────────────────────────
      - name: Status Summary
        if: inputs.action == 'status'
        run: |
          echo "## 📊 Lab Server Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Instance | \`${{ steps.check.outputs.instance_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| State | \`${{ steps.check.outputs.state }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Public IP | \`${{ steps.check.outputs.public_ip }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Stopped At | \`${{ steps.check.outputs.stopped_at }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Golden AMI | \`${{ steps.check.outputs.golden_ami }}\` |" >> $GITHUB_STEP_SUMMARY

      # ─── Check Idle Duration ────────────────────────────
      - name: Check Idle Duration
        id: idle
        if: |
          steps.check.outputs.exists == 'true' &&
          steps.check.outputs.state == 'stopped' &&
          (inputs.action == 'auto' || inputs.action == '')
        run: |
          STOPPED_AT="${{ steps.check.outputs.stopped_at }}"

          if [ "$STOPPED_AT" = "None" ] || [ -z "$STOPPED_AT" ]; then
            echo "⚠️ Server is stopped but has no StoppedAt tag. Tagging now."
            aws ec2 create-tags --resources "${{ steps.check.outputs.instance_id }}" \
              --tags "Key=StoppedAt,Value=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "should_terminate=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          STOPPED_EPOCH=$(date -d "$STOPPED_AT" +%s 2>/dev/null || echo "0")
          NOW_EPOCH=$(date -u +%s)
          IDLE_SECONDS=$((NOW_EPOCH - STOPPED_EPOCH))
          IDLE_DAYS=$((IDLE_SECONDS / 86400))
          IDLE_HOURS=$((IDLE_SECONDS / 3600))

          echo "📊 Server idle for $IDLE_DAYS day(s) ($IDLE_HOURS hours) — threshold: ${{ env.IDLE_DAYS_THRESHOLD }} days"

          if [ "$IDLE_DAYS" -ge "${{ env.IDLE_DAYS_THRESHOLD }}" ]; then
            echo "🛑 Idle threshold exceeded. Will terminate."
            echo "should_terminate=true" >> $GITHUB_OUTPUT
          else
            REMAINING_DAYS=$(( ${{ env.IDLE_DAYS_THRESHOLD }} - IDLE_DAYS ))
            echo "✅ Below threshold. $REMAINING_DAYS day(s) remaining before termination."
            echo "should_terminate=false" >> $GITHUB_OUTPUT
          fi

      # ─── Terminate Server ───────────────────────────────
      - name: Terminate Server
        if: |
          steps.check.outputs.exists == 'true' && (
            inputs.action == 'terminate' ||
            (steps.idle.outputs.should_terminate == 'true' && (inputs.action == 'auto' || inputs.action == ''))
          )
        run: |
          INSTANCE_ID="${{ steps.check.outputs.instance_id }}"
          echo "🛑 Terminating lab server: $INSTANCE_ID"

          # ─── Release Elastic IP ───
          ALLOC_ID=$(aws ec2 describe-addresses \
            --filters "Name=tag:Project,Values=DevOpsDuoo" \
            --query 'Addresses[0].AllocationId' --output text 2>/dev/null || echo "None")

          if [ "$ALLOC_ID" != "None" ] && [ -n "$ALLOC_ID" ]; then
            # Disassociate first (if associated)
            ASSOC_ID=$(aws ec2 describe-addresses \
              --allocation-ids "$ALLOC_ID" \
              --query 'Addresses[0].AssociationId' --output text 2>/dev/null || echo "None")
            if [ "$ASSOC_ID" != "None" ] && [ -n "$ASSOC_ID" ]; then
              aws ec2 disassociate-address --association-id "$ASSOC_ID" 2>/dev/null || true
            fi
            aws ec2 release-address --allocation-id "$ALLOC_ID" 2>/dev/null || true
            echo "✅ Elastic IP released"
          else
            echo "ℹ️ No Elastic IP found to release"
          fi

          # ─── Terminate Instance ───
          aws ec2 terminate-instances --instance-ids "$INSTANCE_ID"
          echo "✅ Instance terminated: $INSTANCE_ID"

          # ─── Summary ───
          echo ""
          echo "═══════════════════════════════════════"
          echo "  🗑️  Server Terminated"
          echo "═══════════════════════════════════════"
          echo "  Instance:    $INSTANCE_ID"
          echo "  EIP:         Released"
          echo "  Golden AMI:  ${{ steps.check.outputs.golden_ami }} (preserved)"
          echo ""
          echo "  Next lab request will auto-create"
          echo "  a new server from the Golden AMI"
          echo "  in ~2-3 minutes."
          echo "═══════════════════════════════════════"

          echo "## 🗑️ Server Terminated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Instance \`$INSTANCE_ID\` has been terminated." >> $GITHUB_STEP_SUMMARY
          echo "Elastic IP released. Golden AMI preserved." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next lab request will auto-create from Golden AMI (~2-3 min)." >> $GITHUB_STEP_SUMMARY

      # ─── Skip (running server in auto mode) ─────────────
      - name: Skip - Server Running
        if: |
          steps.check.outputs.exists == 'true' &&
          steps.check.outputs.state == 'running' &&
          (inputs.action == 'auto' || inputs.action == '')
        run: |
          echo "✅ Server is running. The on-instance idle-shutdown cron handles idle detection."
          echo "   No action needed from the janitor."
