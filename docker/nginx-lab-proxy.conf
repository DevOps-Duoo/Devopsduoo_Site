# ─────────────────────────────────────────────────────────
# Nginx Reverse Proxy for DevOps Duoo Lab Sessions
# Terminates SSL and proxies to ttyd containers on localhost
# ─────────────────────────────────────────────────────────
# 
# How it works:
#   - Each lab session runs ttyd on a unique port (7681-7690)
#   - When a session starts, its mapping is added to /etc/nginx/lab-ports.map
#   - Nginx reads the map and routes /s/<session-id>/ → localhost:<port>
#   - SSL is handled by Let's Encrypt certificates
#
# Map file format (/etc/nginx/lab-ports.map):
#   map $session_id $backend_port {
#       default         0;
#       lab-1234-abcdef 7681;
#       lab-5678-ghijkl 7682;
#   }

# Include the session-to-port map (generated dynamically)
include /etc/nginx/lab-ports.map;

server {
    listen 80;
    server_name LAB_DOMAIN_PLACEHOLDER;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name LAB_DOMAIN_PLACEHOLDER;

    # SSL certificates (managed by certbot)
    ssl_certificate /etc/letsencrypt/live/LAB_DOMAIN_PLACEHOLDER/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/LAB_DOMAIN_PLACEHOLDER/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000" always;

    # Allow iframe embedding from devopsduoo.in and devopsduoo.com
    add_header Content-Security-Policy "frame-ancestors https://*.devopsduoo.in https://devopsduoo.in https://*.devopsduoo.com https://devopsduoo.com" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Session-based routing ─────────────────────────────
    # URL pattern: /s/<session-id>/
    # Extracts session ID, looks up port from map, proxies to ttyd

    location ~ ^/s/([^/]+)/(.*) {
        # Extract session ID from URL
        set $session_id $1;
        set $remaining_path $2;

        # Check if session exists in the port map
        if ($backend_port = 0) {
            return 404 '{"error": "Session not found or expired"}';
        }

        # Proxy to the ttyd container
        proxy_pass http://127.0.0.1:$backend_port/$remaining_path$is_args$args;
        proxy_http_version 1.1;

        # WebSocket support (required for ttyd)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client info
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-lived WebSocket connections
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # Disable buffering for real-time terminal
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Health check endpoint ─────────────────────────────
    location /health {
        return 200 '{"status": "ok"}';
        add_header Content-Type application/json;
    }

    # ── Root — info page ──────────────────────────────────
    location / {
        return 200 '{"service": "DevOps Duoo Lab Proxy", "status": "running"}';
        add_header Content-Type application/json;
    }
}
